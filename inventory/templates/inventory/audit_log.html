{% extends 'inventory/base.html' %}
{% block title %}Audit log{% endblock %}
{% block content %}
<div class="container py-3">
  <h2>Audit log</h2>
  <table class="table table-sm"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Detail</th></tr></thead>
  <tbody>{% for l in logs %}
    <tr><td>{{ l.created_at }}</td><td>{{ l.user }}</td><td>{{ l.action }}</td><td>{{ l.detail }}</td></tr>
  {% empty %}<tr><td colspan="4">Empty</td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
