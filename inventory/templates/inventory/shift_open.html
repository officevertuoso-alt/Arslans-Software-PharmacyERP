{% extends 'inventory/base.html' %}
{% block title %}Open Shift{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:480px">
  <h2>Open POS shift</h2>
  <p class="text-muted">Opening float (cash in drawer) before sales start.</p>
  <form method="post" class="card card-body">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Opening float (Rs.)</label>
      <input type="number" step="0.01" min="0" name="opening_float" class="form-control form-control-lg" value="0" required>
    </div>
    <button class="btn btn-success btn-lg w-100">Open shift</button>
  </form>
</div>
{% endblock %}
