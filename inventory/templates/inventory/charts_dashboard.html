{% extends 'inventory/base.html' %}
{% block title %}Sales Charts{% endblock %}
{% block content %}
<div class="container py-3">
  <h2>Sales Charts</h2>
  <p class="text-muted">Same style as reference pharmacy system — monthly sales, top drugs, cashbook trend.</p>
  <div class="row g-3">
    <div class="col-lg-6"><div class="card card-body"><h5>Sales per Month</h5><canvas id="chartMonthly" height="220"></canvas></div></div>
    <div class="col-lg-6"><div class="card card-body"><h5>Sales per Drug (Top 10)</h5><canvas id="chartTop" height="220"></canvas></div></div>
    <div class="col-lg-12"><div class="card card-body"><h5>Cashbook net (14 days)</h5><canvas id="chartCash" height="100"></canvas></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
fetch('{% url "charts_data_api" %}')
  .then(r => r.json())
  .then(d => {
    new Chart(document.getElementById('chartMonthly'), {
      type: 'bar',
      data: { labels: d.monthly.labels, datasets: [{ label: 'Sales Rs.', data: d.monthly.totals, backgroundColor: '#00d1b2' }] },
      options: { plugins: { legend: { display: false } } }
    });
    new Chart(document.getElementById('chartTop'), {
      type: 'bar',
      data: { labels: d.top_products.labels, datasets: [{ label: 'Revenue', data: d.top_products.totals, backgroundColor: '#3e8ed0' }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false } } }
    });
    new Chart(document.getElementById('chartCash'), {
      type: 'line',
      data: { labels: d.cashbook.labels, datasets: [{ label: 'Net cash', data: d.cashbook.nets, borderColor: '#f14668', tension: 0.2 }] },
    });
  });
</script>
{% endblock %}
